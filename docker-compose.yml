services:
  postgres:
    image: postgres:latest
    container_name: sysmho-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sysmho}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sysmho_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sysmho}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sysmho_pgdata:
