[project]
name = "sysmho"
version = "15.2.0"
description = "Neural Combat Financial System — Autonomous crypto trading bot with AI"
requires-python = ">=3.12"
dependencies = [
    # APIs and Connectivity
    "ccxt>=4.2.14",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.9.3",
    # Database
    "asyncpg>=0.29.0",
    # Data and Analysis
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "ta>=0.11.0",
    # AI and Machine Learning
    "scikit-learn>=1.4.1",
    "xgboost>=2.0.3",
    "joblib>=1.3.2",
    "optuna>=3.6.1",
    # Dashboard and API
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.6.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]
