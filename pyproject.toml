[project]
name = "sysmho"
version = "15.3.0"
description = "Neural Combat Financial System — Autonomous crypto trading bot with AI + Gemini Intelligence"
requires-python = ">=3.12"
dependencies = [
    # APIs and Connectivity
    "ccxt>=4.2.14",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.9.3",
    # Database
    "asyncpg>=0.29.0",
    # Data and Analysis
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "ta>=0.11.0",
    # AI and Machine Learning
    "scikit-learn>=1.4.1",
    "xgboost>=2.0.3",
    "joblib>=1.3.2",
    "optuna>=3.6.1",
    # Dashboard and API
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.6.3",
    "httpx>=0.27.0",
    "google-genai>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
]

[project.scripts]
db-start = "scripts.cli:db_start"
db-stop = "scripts.cli:db_stop"
db-status = "scripts.cli:db_status"
db-migrate = "scripts.cli:db_migrate"
db-seed = "scripts.cli:db_seed"
db-backup = "scripts.cli:db_backup"
db-start-docker = "scripts.cli:db_start_docker"
db-stop-docker = "scripts.cli:db_stop_docker"
db-status-docker = "scripts.cli:db_status_docker"
db-migrate-docker = "scripts.cli:db_migrate_docker"
db-seed-docker = "scripts.cli:db_seed_docker"
db-backup-docker = "scripts.cli:db_backup_docker"
engine = "scripts.cli:engine"
dashboard = "scripts.cli:dashboard"
test = "scripts.cli:test"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
